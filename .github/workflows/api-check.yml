name: API-Test (temporär)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "Hamburg%20Hbf" "Berlin" "Muenchen"; do
            echo "=== $q"
            curl -sS -m 30 -w "\nHTTP %{http_code} in %{time_total}s\n" -A "LightBahn/0.1 (Light Phone III community tool)" \
              "https://v6.db.transport.rest/locations?query=$q&results=3&stops=true&addresses=false&poi=false&language=de" | head -c 1500
            echo
          done
          echo "=== ohne Zusatzparameter"
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://v6.db.transport.rest/locations?query=Hamburg&results=2" | head -c 800
